name: CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint code
        run: npm run lint

      - name: Lint pipeline bypass (commitToPipeline enforcement)
        run: npm run lint:pipeline-bypass

      - name: Lint - no new direct canonical VFS writers
        run: npm run lint:canonical-vfs-writes

      - name: Lint single source of truth (brainstem import guard)
        run: npm run lint:single-source-of-truth

      - name: 21st generation coverage gate (blocking)
        run: npx vitest run src/test/twentyFirstCoverageGate.test.ts src/test/twentyFirstGenerationPolicy.test.ts --reporter=default

      - name: Run unit & contract tests (blocking)
        run: npx vitest run --reporter=default

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NODE_OPTIONS: "--max_old_space_size=4096"
