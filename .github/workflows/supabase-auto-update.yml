name: Supabase Deploy (UNISON)

# Deploys backend changes to the authoritative UNISON project selected by the
# SUPABASE_PROJECT_ID / SUPABASE_ACCESS_TOKEN repository secrets. Any failure
# fails the workflow. No dependency upgrades run here.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'drizzle/migrations/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy all Edge Functions and push pending migrations'
        type: boolean
        default: false
      base_sha:
        description: 'Optional commit SHA to diff against for a targeted manual deployment'
        type: string
        required: false

concurrency:
  group: supabase-deploy-unison
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  EXPECTED_PROJECT_REF: nfrdomdvyrbwuokathtw

jobs:
  deploy:
    name: Deploy backend changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify target project
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID secrets are required."; exit 1
          fi
          if [[ ! "${SUPABASE_ACCESS_TOKEN}" =~ ^sbp_.+ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase Personal Access Token beginning with sbp_. Update the GitHub secret; do not use a project API key."; exit 1
          fi
          if [ "${SUPABASE_PROJECT_ID}" != "${EXPECTED_PROJECT_REF}" ]; then
            echo "::error::SUPABASE_PROJECT_ID does not match the authoritative UNISON project."; exit 1
          fi

      - name: Detect changes
        id: changes
        env:
          DEPLOY_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            funcs=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' ! -name 'node_modules' -printf '%f\n' | sort | tr '\n' ' ')
            echo "functions=$funcs" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="${DEPLOY_BASE_SHA}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          if echo "$CHANGED" | grep -q '^drizzle/migrations/' && ! echo "$CHANGED" | grep -q '^supabase/migrations/[0-9]\{14\}_.*\.sql$'; then
            echo "::error::drizzle/migrations changed without a matching timestamped supabase/migrations/*.sql file. UNISON deploys only canonical supabase/migrations; add the equivalent migration there."
            exit 1
          fi
          if echo "$CHANGED" | grep -q '^supabase/migrations/'; then echo "migrations=true" >> "$GITHUB_OUTPUT"; else echo "migrations=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$CHANGED" | grep -Eq '^supabase/config\.toml$|^supabase/functions/(_shared/|deno\.json$|import_map\.json$)'; then
            funcs=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' ! -name 'node_modules' -printf '%f\n' | sort | tr '\n' ' ')
          else
            funcs=$(echo "$CHANGED" | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' | sort -u | while read -r f; do [ -d "supabase/functions/$f" ] && echo "$f"; done | tr '\n' ' ')
          fi
          echo "functions=$funcs" >> "$GITHUB_OUTPUT"

      - name: Push migrations
        if: steps.changes.outputs.migrations == 'true'
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is required to apply migrations."; exit 1
          fi
          supabase link --project-ref "${SUPABASE_PROJECT_ID}" --password "${SUPABASE_DB_PASSWORD}"
          supabase db push --linked --password "${SUPABASE_DB_PASSWORD}"

      - name: Deploy Edge Functions
        if: steps.changes.outputs.functions != ''
        run: |
          set -euo pipefail
          for f in ${{ steps.changes.outputs.functions }}; do
            echo "Deploying $f"
            supabase functions deploy "$f" --project-ref "${SUPABASE_PROJECT_ID}"
          done

      - name: Summary
        run: |
          {
            echo "## UNISON backend deploy"
            echo "- Migrations pushed: ${{ steps.changes.outputs.migrations }}"
            echo "- Functions: ${{ steps.changes.outputs.functions || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"
